env: python
buildCommand: pip install -r requirements.txt
startCommand: gunicorn app:app --bind 0.0.0.0:8080
envVars:
  - key: DIGITAL_OCEAN_APP
    value: "true"
  - key: FLASK_ENV
    value: "production"
  - key: PYTHONUNBUFFERED
    value: "true"

services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
    routes:
      - path: /
    envVars:
      - key: DIGITAL_OCEAN_APP
        value: "true"

static_sites:
  - name: static
    github:
      repo: your-repo
      branch: main
      deploy_on_push: true
    routes:
      - path: /static
