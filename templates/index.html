<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .drop-zone {
            border: 2px dashed #cbd5e0;
            transition: all 0.3s ease;
        }
        .drop-zone.dragover {
            border-color: #4299e1;
            background-color: #ebf8ff;
        }
        .preview-image {
            width: 180px;
            height: 320px;
            object-fit: cover;
            margin: 5px;
        }
        .effect-option {
            transition: all 0.3s ease;
        }
        .effect-option.selected {
            border-color: #4299e1;
            background-color: #ebf8ff;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-3xl font-bold text-center mb-8">Video Generator</h1>
            
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div id="drop-zone" class="drop-zone rounded-lg p-8 text-center cursor-pointer mb-4">
                    <p class="text-gray-600 mb-2">Drag and drop an image here or click to select</p>
                    <p class="text-sm text-gray-500">Will generate a 25-second video with selected effect</p>
                    <input type="file" id="file-input" accept="image/*" class="hidden">
                </div>

                <div id="preview" class="flex justify-center mb-4"></div>

                <!-- Effect Selection -->
                <div class="mb-6">
                    <h3 class="text-lg font-semibold mb-3">Select Effect:</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="effect-option cursor-pointer border rounded-lg p-4 hover:bg-blue-50" data-effect="left">
                            <div class="flex items-center">
                                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                                </svg>
                                <span>Pan Left</span>
                            </div>
                        </div>
                        <div class="effect-option cursor-pointer border rounded-lg p-4 hover:bg-blue-50" data-effect="right">
                            <div class="flex items-center">
                                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                                </svg>
                                <span>Pan Right</span>
                            </div>
                        </div>
                        <div class="effect-option cursor-pointer border rounded-lg p-4 hover:bg-blue-50" data-effect="up">
                            <div class="flex items-center">
                                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
                                </svg>
                                <span>Pan Up</span>
                            </div>
                        </div>
                        <div class="effect-option cursor-pointer border rounded-lg p-4 hover:bg-blue-50" data-effect="down">
                            <div class="flex items-center">
                                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
                                </svg>
                                <span>Pan Down</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="progress" class="hidden">
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                    <p id="progress-text" class="text-sm text-gray-600 mt-2 text-center"></p>
                </div>

                <div id="download-info" class="hidden mt-4 p-4 bg-green-50 rounded-lg">
                    <p class="text-green-700 font-medium">Video generated successfully!</p>
                    <p class="text-sm text-green-600 mt-1">Your video will expire in <span id="expires-in">60</span> minutes</p>
                    <p class="text-sm text-green-600">Expires at: <span id="expires-at"></span></p>
                    <a id="download-link" href="#" class="mt-3 inline-block bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition-colors">
                        Download Video
                    </a>
                </div>

                <div class="flex justify-center">
                    <button id="generate-btn" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition-colors disabled:bg-gray-400" disabled>
                        Generate Video
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const generateBtn = document.getElementById('generate-btn');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const downloadInfo = document.getElementById('download-info');
        const downloadLink = document.getElementById('download-link');
        const expiresIn = document.getElementById('expires-in');
        const expiresAt = document.getElementById('expires-at');
        const effectOptions = document.querySelectorAll('.effect-option');
        
        let selectedFile = null;
        let selectedEffect = 'left'; // Default effect

        // Effect selection handling
        effectOptions.forEach(option => {
            option.addEventListener('click', () => {
                // Remove selected class from all options
                effectOptions.forEach(opt => opt.classList.remove('selected'));
                // Add selected class to clicked option
                option.classList.add('selected');
                // Update selected effect
                selectedEffect = option.dataset.effect;
                // Enable generate button if file is selected
                updateGenerateButton();
            });
        });

        // Select default effect
        document.querySelector('[data-effect="left"]').classList.add('selected');

        function updateGenerateButton() {
            generateBtn.disabled = !selectedFile || !selectedEffect;
        }

        // Drag and drop handlers
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (file.type.startsWith('image/')) {
                selectedFile = file;
                preview.innerHTML = '';
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.classList.add('preview-image');
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);
                updateGenerateButton();
            }
        }

        generateBtn.addEventListener('click', async () => {
            if (!selectedFile || !selectedEffect) return;

            const formData = new FormData();
            formData.append('files[]', selectedFile);
            formData.append('effect', selectedEffect);

            generateBtn.disabled = true;
            progress.classList.remove('hidden');
            downloadInfo.classList.add('hidden');
            progressText.textContent = 'Starting video generation...';
            progressBar.style.width = '0%';

            let pollInterval;
            let timeoutId;

            const stopPolling = () => {
                if (pollInterval) clearInterval(pollInterval);
                if (timeoutId) clearTimeout(timeoutId);
            };

            try {
                // Start video generation
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Upload failed: ${response.statusText}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    // Poll for video status
                    const videoId = data.video_id;
                    let retryCount = 0;
                    const maxRetries = 3;

                    pollInterval = setInterval(async () => {
                        try {
                            const statusResponse = await fetch(`/status/${videoId}`);
                            
                            if (!statusResponse.ok) {
                                retryCount++;
                                if (retryCount >= maxRetries) {
                                    throw new Error('Failed to get video status after multiple attempts');
                                }
                                return; // Skip this iteration and try again
                            }
                            
                            retryCount = 0; // Reset retry count on successful response
                            const statusData = await statusResponse.json();
                            
                            if (statusData.status === 'completed') {
                                stopPolling();
                                progressBar.style.width = '100%';
                                progressText.textContent = 'Video generated successfully!';
                                
                                // Show download info
                                downloadInfo.classList.remove('hidden');
                                downloadLink.href = statusData.video_path;
                                expiresIn.textContent = Math.floor(statusData.expires_in / 60);
                                expiresAt.textContent = statusData.expires_at;
                                
                                // Start countdown
                                let timeLeft = statusData.expires_in;
                                const countdownInterval = setInterval(() => {
                                    timeLeft -= 60;
                                    if (timeLeft <= 0) {
                                        clearInterval(countdownInterval);
                                        downloadInfo.classList.add('hidden');
                                    } else {
                                        expiresIn.textContent = Math.floor(timeLeft / 60);
                                    }
                                }, 60000);
                            } else if (statusData.status === 'error') {
                                throw new Error(statusData.error || 'Video generation failed');
                            } else {
                                // Update progress
                                progressBar.style.width = `${statusData.progress}%`;
                                progressText.textContent = `Generating video... ${statusData.progress}%`;
                            }
                        } catch (error) {
                            stopPolling();
                            throw error;
                        }
                    }, 2000); // Check every 2 seconds instead of 1
                    
                    // Set timeout to stop polling after 2 minutes
                    timeoutId = setTimeout(() => {
                        stopPolling();
                        if (!downloadInfo.classList.contains('hidden')) return; // Already completed
                        throw new Error('Video generation timed out. Please try again.');
                    }, 120000);
                    
                } else {
                    throw new Error(data.error || 'Failed to start video generation');
                }
            } catch (error) {
                stopPolling();
                progressText.textContent = `Error: ${error.message}`;
                progressBar.style.width = '0%';
                console.error('Video generation error:', error);
            } finally {
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
