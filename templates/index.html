<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .drop-zone {
            border: 2px dashed #cbd5e0;
            transition: all 0.3s ease;
        }
        .drop-zone.dragover {
            border-color: #4299e1;
            background-color: #ebf8ff;
        }
        .preview-image {
            width: 180px;
            height: 320px;
            object-fit: cover;
            margin: 5px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-3xl font-bold text-center mb-8">Video Generator</h1>
            
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div id="drop-zone" class="drop-zone rounded-lg p-8 text-center cursor-pointer mb-4">
                    <p class="text-gray-600 mb-2">Drag and drop an image here or click to select</p>
                    <p class="text-sm text-gray-500">Will generate a 25-second video with smooth panning effect</p>
                    <input type="file" id="file-input" accept="image/*" class="hidden">
                </div>

                <div id="preview" class="flex justify-center mb-4"></div>

                <div id="progress" class="hidden">
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                    <p id="progress-text" class="text-sm text-gray-600 mt-2 text-center"></p>
                </div>

                <div id="download-info" class="hidden mt-4 p-4 bg-green-50 rounded-lg">
                    <p class="text-green-700 font-medium">Video generated successfully!</p>
                    <p class="text-sm text-green-600 mt-1">Your video will expire in <span id="expires-in">60</span> minutes</p>
                    <p class="text-sm text-green-600">Expires at: <span id="expires-at"></span></p>
                    <a id="download-link" href="#" class="mt-3 inline-block bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition-colors">
                        Download Video
                    </a>
                </div>

                <div class="flex justify-center">
                    <button id="generate-btn" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition-colors disabled:bg-gray-400" disabled>
                        Generate Video
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const generateBtn = document.getElementById('generate-btn');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const downloadInfo = document.getElementById('download-info');
        const downloadLink = document.getElementById('download-link');
        const expiresIn = document.getElementById('expires-in');
        const expiresAt = document.getElementById('expires-at');
        
        let selectedFile = null;

        // Drag and drop handlers
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (file.type.startsWith('image/')) {
                selectedFile = file;
                preview.innerHTML = '';
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.classList.add('preview-image');
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);
                generateBtn.disabled = false;
            }
        }

        generateBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('files[]', selectedFile);

            generateBtn.disabled = true;
            progress.classList.remove('hidden');
            downloadInfo.classList.add('hidden');
            progressText.textContent = 'Generating video...';
            progressBar.style.width = '50%';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.success) {
                    progressBar.style.width = '100%';
                    progressText.textContent = 'Video generated successfully!';
                    
                    // Show download info
                    downloadInfo.classList.remove('hidden');
                    downloadLink.href = data.video_path;
                    expiresIn.textContent = Math.floor(data.expires_in / 60);
                    expiresAt.textContent = data.expires_at;
                    
                    // Start countdown
                    let timeLeft = data.expires_in;
                    const countdownInterval = setInterval(() => {
                        timeLeft -= 60;
                        if (timeLeft <= 0) {
                            clearInterval(countdownInterval);
                            downloadInfo.classList.add('hidden');
                        } else {
                            expiresIn.textContent = Math.floor(timeLeft / 60);
                        }
                    }, 60000); // Update every minute
                } else {
                    throw new Error(data.error || 'Failed to generate video');
                }
            } catch (error) {
                progressText.textContent = `Error: ${error.message}`;
                progressBar.style.width = '0%';
            } finally {
                generateBtn.disabled = false;
                setTimeout(() => {
                    progress.classList.add('hidden');
                    progressBar.style.width = '0%';
                }, 3000);
            }
        });
    </script>
</body>
</html>
